<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sellia</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--mut:#6f6a8c;--pu:#7c5cff;--pk:#ff7eb6;--mi:#3ed6a4;--line:#e8e3fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 10% 0,#ffe6f1 0,transparent 40%),radial-gradient(circle at 90% 10%,#dff7ee 0,transparent 40%),#f7f4ff}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.5rem;flex:1}
.cam{font-size:1.8rem;animation:hue 6s linear infinite;display:inline-block}@keyframes hue{to{filter:hue-rotate(360deg)}}
h2{font-size:1.4rem;margin:.2em 0 .6em}.sub{color:var(--mut);margin:0 0 16px}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:11px 20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pu),var(--pk));box-shadow:0 6px 16px rgba(124,92,255,.25)}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:default;transform:none}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}button.sm{padding:6px 14px;font-size:.9rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--mi);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 4px 14px rgba(124,92,255,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;margin:0}.pcard:hover{border-color:var(--pu)}
.new{border:2px dashed var(--pu);background:transparent;align-items:center;justify-content:center;min-height:110px;color:var(--pu);font-weight:800;text-align:center}
.plus{font-size:2rem;line-height:1}
.msg{padding:10px 15px;border-radius:18px;margin:8px 0;max-width:85%;white-space:pre-wrap;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.s{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}.u{background:linear-gradient(135deg,var(--pu),var(--pk));color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--pu);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.typ{color:var(--mut);font-size:.9rem}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}input{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:99px;font:inherit;background:#fff}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:800;margin-right:4px}
.atraer,.humanizar{background:#ffe2c2}.nutrir{background:#d6e6ff}.convertir{background:#cdf5e3}
.hidden{display:none!important}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--pk),var(--mi));transition:width .6s}
.work{text-align:center;padding:40px 10px}.work .cam{font-size:4rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.8rem}.cal b{text-align:center;color:var(--mut)}
.day{min-height:62px;border-radius:10px;background:#faf8ff;padding:3px;overflow:hidden}.day.has{background:#fff;border:1px solid var(--pu)}.day small{color:var(--mut)}
.chip{display:block;border-radius:6px;padding:0 3px;margin-top:2px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
details{margin-top:6px}summary{cursor:pointer;font-weight:700;color:var(--pu)}
.trial{position:relative;user-select:none;-webkit-user-select:none}pre{white-space:pre-wrap;font:inherit;margin:8px 0}
.err{color:#c0305f;font-weight:700}
</style></head><body><main>
<header><div class="logo"><span class="cam" aria-hidden="true">🦎</span>Sell<span style="color:var(--pu)">.ia</span></div>
<button id="back" class="alt sm hidden">← Volver</button><button id="exit" class="alt sm hidden">Salir</button></header>

<section id="home"><h2>Tus perfiles</h2><p class="sub">Cada perfil es una marca con su propio plan de contenido.</p>
<div class="grid" id="plist"></div><p class="sub" id="lim"></p></section>

<section id="chat" class="hidden"><div id="log"></div>
<div class="row"><input id="inp" placeholder="Escribile a Sell.ia…" aria-label="Mensaje"><button id="send">Enviar</button></div>
<div class="row"><button id="prof" class="hidden">Armar el perfil de mi marca ✨</button></div></section>

<section id="work" class="hidden work"><div class="cam" aria-hidden="true">🦎</div><h2 id="wt">Trabajando…</h2><p class="sub" id="wm"></p>
<div class="bar"><i id="wb"></i></div><div id="we"></div></section>

<section id="pr" class="hidden"><h2>Tu perfil de marca 🎉</h2><div id="pbox" class="card"></div>
<button id="mk">Crear mi plan de contenido</button></section>

<section id="plan" class="hidden"><h2>Tu plan de contenido</h2>
<div class="card"><label for="start"><b>¿Cuándo querés empezar a publicar?</b></label>
<div class="row"><input type="date" id="start"></div></div>
<div id="cals"></div><h2>Videos y piezas</h2><div id="pcs"></div><h2>Historias</h2><div id="hs"></div></section>
</main><script>
const $=i=>document.getElementById(i),LIM=3; // LIM: perfiles permitidos por plan (a futuro, por usuario/plan en el servidor)
const ls=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
let profs=ls('sellia.profiles')||[];if(!profs.length&&localStorage.sid)profs=[{id:localStorage.sid,name:'Mi marca',status:'Retomar'}];
let cur=null,step='home',pieces=[],cal=null;
const save=()=>ls('sellia.profiles',profs);
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brandId:cur.id,...b})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'Error '+r.status);return j});
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IC={reel:'🎬',carrusel:'🖼️',video_camara:'🎥',post:'📝',tour:'🏠'};
function go(s){step=s;['home','chat','work','pr','plan'].forEach(x=>$(x).classList.toggle('hidden',x!==s));
 $('back').classList.toggle('hidden',s==='home');$('exit').classList.toggle('hidden',s==='home');scrollTo(0,0);if(s==='home')renderHome()}
const BACK={chat:'home',pr:'chat',plan:'pr',work:'home'};
$('back').onclick=()=>go(BACK[step]);$('exit').onclick=()=>go('home');

// ---- Perfiles ----
function renderHome(){const l=$('plist');l.innerHTML='';
 profs.forEach(p=>{const d=document.createElement('div');d.className='card pcard';d.innerHTML=`<span style="font-size:1.6rem">🦎</span><b>${esc(p.name)}</b><span class="sub" style="margin:0">${esc(p.status||'Sin empezar')}</span>`;d.onclick=()=>openProf(p);l.append(d)});
 const full=profs.length>=LIM,n=document.createElement('div');n.className='card pcard new';
 n.innerHTML=full?`<span>🔒 Límite de tu plan</span>`:`<span class="plus">+</span>Nuevo perfil`;
 n.onclick=()=>{if(full)return;const p={id:crypto.randomUUID(),name:'Perfil nuevo',status:'Onboarding'};profs.push(p);save();openProf(p)};l.append(n);
 $('lim').textContent=`Tu plan incluye ${LIM} perfiles · usaste ${profs.length}`}
async function openProf(p){cur=p;pieces=ls('sellia.p.'+p.id)||[];$('log').innerHTML='';
 busy('Abriendo tu perfil','Un segundito…',['Buscando tu marca…'],async()=>{
  const b=await fetch('/api/brand?id='+encodeURIComponent(p.id)).then(r=>r.json());
  if(b.error)throw new Error(b.error);cal=b.calendar;
  if(cal&&pieces.length){showPlan()}else if(b.profile){showProf(b.profile)}
  else{go('chat');const t=b.transcript||[];if(!t.length)return say('Hola');
   t.forEach((m,i)=>{if(!(i===0&&m.content==='Hola'))add(m.content,m.role==='user'?'u':'s')});if(p.status==='Listo para armar')$('prof').classList.remove('hidden')}})}

// ---- Procesando (para que no parezca colgado) ----
let tm,pct=0;
async function busy(title,sub,msgs,fn,onErr){go('work');$('wt').textContent=title;$('wm').textContent=sub;$('we').innerHTML='';pct=5;$('wb').style.width='5%';let i=0;
 clearInterval(tm);tm=setInterval(()=>{pct+=(92-pct)*.06;$('wb').style.width=pct+'%';if(msgs.length)$('wm').textContent=msgs[i++%msgs.length]},2600);
 try{await fn()}catch(e){$('wt').textContent='Uy, algo se trabó 😅';$('wm').textContent='';$('we').innerHTML=`<p class="err">${esc(e.message)}</p><button id="rt">Reintentar</button>`;$('rt').onclick=()=>busy(title,sub,msgs,fn)}
 finally{clearInterval(tm)}}
const prog=(p,m)=>{pct=p;$('wb').style.width=p+'%';$('wm').textContent=m};

// ---- Chat ----
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('log').append(d);d.scrollIntoView({block:'end'});return d}
async function say(t){$('send').disabled=true;if(t!=='Hola')add(t,'u');
 const ty=document.createElement('div');ty.className='msg s typ';ty.innerHTML='Sell.ia está escribiendo <span class="dots"><span></span><span></span><span></span></span>';$('log').append(ty);ty.scrollIntoView({block:'end'});
 try{const[r]=await Promise.all([post('/api/onboarding',{text:t}),sleep(900)]);ty.remove();add(r.reply,'s');
  if(r.done){cur.status='Listo para armar';save();$('prof').classList.remove('hidden')}}
 catch(e){ty.remove();add('Uy, no pude responder: '+e.message+' · Probá de nuevo.','s')}
 $('send').disabled=false;$('inp').focus()}
$('send').onclick=()=>{const v=$('inp').value.trim();if(v){$('inp').value='';say(v)}};$('inp').onkeydown=e=>{if(e.key==='Enter')$('send').click()};

// ---- Perfil ----
$('prof').onclick=()=>busy('Armando el perfil de tu marca','',['Leyendo todo lo que me contaste…','Definiendo tu cliente ideal…','Afinando el mensaje de tu marca…','Casi listo, dándole los últimos retoques…'],async()=>showProf(await post('/api/profile',{})));
function showProf(p){const c=p.cliente_ideal||{};cur.name=p.marca||cur.name;cur.status='Perfil listo';save();
 $('pbox').innerHTML=`<h3 style="margin:0">${esc(p.marca)} <small style="color:var(--mut)">· ${esc(p.industria)}</small></h3><p><b>Problema:</b> ${esc(p.problema)}</p><p><b>Para quién:</b> ${esc(p.para_quien)}</p><p><b>Por qué esta marca:</b> ${esc(p.por_que_esta_marca)}</p><p><b>Cliente ideal:</b> ${esc(c.nombre)}: ${esc(c.descripcion)}</p><p><b>Dolores:</b> ${esc((c.dolores||[]).join('; '))}</p>`;go('pr')}

// ---- Plan: calendarios + textos de cada video ----
$('mk').onclick=()=>busy('Creando tu plan de contenido','',['Diseñando tu calendario…','Eligiendo los mejores ganchos…','Pensando tus historias…'],async()=>{
 cal=await post('/api/calendar',{});pieces=[];const n=cal.contenido.length;
 for(let i=0;i<n;i++){prog(20+70*i/n,`Escribiendo el guion ${i+1} de ${n}…`);try{pieces[i]=await post('/api/copy',{piece:cal.contenido[i]})}catch{pieces[i]=null}}
 ls('sellia.p.'+cur.id,pieces);cur.status='Plan listo';save();showPlan()});
async function genPiece(i,btn){btn.textContent='Escribiendo…';btn.disabled=true;try{pieces[i]=await post('/api/copy',{piece:cal.contenido[i]});ls('sellia.p.'+cur.id,pieces);renderPlan()}catch(e){btn.textContent='Reintentar';btn.disabled=false}}
const fmt=d=>d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
function showPlan(){const s=ls('sellia.start.'+cur.id);const t=new Date();t.setDate(t.getDate()+1);
 $('start').value=s||t.toISOString().slice(0,10);go('plan');renderPlan()}
$('start').onchange=()=>{ls('sellia.start.'+cur.id,$('start').value);renderPlan()};
function renderPlan(){const[y,m,d]=$('start').value.split('-').map(Number);const at=n=>new Date(y,m-1,d+n-1);
 const items=cal.contenido.map((p,i)=>({p,i,dt:at(p.dia)}));
 // calendario mensual
 let h='';const months=[...new Set(items.map(x=>x.dt.getFullYear()*12+x.dt.getMonth()))];
 months.forEach(k=>{const yy=Math.floor(k/12),mm=k%12,first=new Date(yy,mm,1),lead=(first.getDay()+6)%7,dim=new Date(yy,mm+1,0).getDate();
  h+=`<div class="card"><b>${first.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><div class="cal" style="margin-top:8px">${['L','M','M','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${'<div></div>'.repeat(lead)}`;
  for(let n=1;n<=dim;n++){const hit=items.filter(x=>x.dt.getFullYear()==yy&&x.dt.getMonth()==mm&&x.dt.getDate()==n);
   h+=`<div class="day ${hit.length?'has':''}"><small>${n}</small>${hit.map(x=>`<span class="chip ${x.p.fase}" onclick="document.getElementById('pc${x.i}').scrollIntoView({behavior:'smooth'})">${IC[x.p.formato]||'📌'} ${esc(x.p.tema)}</span>`).join('')}</div>`}
  h+='</div></div>'});$('cals').innerHTML=h;
 $('pcs').innerHTML=items.map(({p,i,dt})=>{const r=pieces[i];const body=r?`<details><summary>Ver guion y copy</summary><div class="${r.trial?'trial':''}" ${r.trial?'oncopy="return false" oncontextmenu="return false"':''}><pre><b>Gancho:</b> ${esc(r.gancho)}\n\n<b>Problema:</b> ${esc(r.problema)}\n\n<b>Solución:</b> ${esc(r.solucion)}\n\n<b>CTA:</b> ${esc(r.cta)}\n\n${esc(r.copy)}\n\n${(r.slides||[]).map((s,j)=>`Slide ${j+1}: ${esc(s)}`).join('\n')}\n\n${esc(r.guion||'')}</pre></div></details>`:`<button class="sm alt" onclick="genPiece(${i},this)">Crear texto</button>`;
  return `<div class="card" id="pc${i}"><span class="tag ${p.fase}">${esc(p.fase)}</span><span class="tag" style="background:#eee">${IC[p.formato]||''} ${esc(p.formato)}</span> <b>📅 ${fmt(dt)}</b><div><b>${esc(p.gancho)}</b></div>${body}</div>`}).join('');
 $('hs').innerHTML=(cal.historias||[]).map(x=>`<div class="card"><span class="tag ${x.fase}">${esc(x.fase)}</span> <b>📅 ${fmt(at(x.dia))}</b> · ${esc(x.idea)}</div>`).join('')}
go('home');
</script></body></html>
